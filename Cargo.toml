[package]
name = "tabbyapi-monitor"
version = "0.1.0"
edition = "2024"
description = "A lightweight vllmstat-style terminal monitor for TabbyAPI and ExLlamaV3"
authors = ["Marcel Holter"]
license = "MIT"
repository = "https://github.com/anstaendig/tabbyapi-monitor"
readme = "README.md"
keywords = ["tabbyapi", "exllamav3", "llm", "monitoring", "tui"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
